services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillswap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillswap"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/skillswap
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: skillswap-docker-dev-secret-key-change-in-prod
      NODE_ENV: production
      # Groq powers the AI features (roadmaps, quizzes, weekly reports).
      # Set GROQ_API_KEY in your shell (or a .env file) before `docker compose up`.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
